<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pet Identifier UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0b172a;
        color: #f7f9fc;
        margin: 0;
        padding: 24px;
      }
      h1 {
        margin-bottom: 16px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      input[type="file"] {
        color: #f7f9fc;
      }
      button {
        background: #1f8ef1;
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
      }
      button:disabled {
        background: #2c3e50;
        cursor: not-allowed;
      }
      #status {
        min-height: 24px;
        margin-bottom: 16px;
      }
      .canvas-wrapper {
        position: relative;
        max-width: 100%;
        overflow: auto;
        border: 1px solid #1f8ef1;
        border-radius: 12px;
        background: #060f1f;
        padding: 12px;
        margin-bottom: 24px;
      }
      canvas {
        max-width: 100%;
      }
      #results {
        background: #0f2141;
        border-radius: 12px;
        padding: 16px;
        min-height: 80px;
      }
      .result-item {
        margin-bottom: 8px;
      }
      .result-item:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <h1>Pet Identifier</h1>
    <div class="controls">
      <input type="file" id="file-input" accept="image/*" />
      <button id="identify-btn">Identify</button>
    </div>
    <div id="status"></div>
    <div class="canvas-wrapper">
      <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    <section id="results">
      <strong>Results</strong>
      <div id="results-list"></div>
    </section>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
