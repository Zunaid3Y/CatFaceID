<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CatFaceID</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>CatFaceID</h1>

    <div class="tabs">
      <button id="tab-identify" class="tab active">Identify</button>
      <button id="tab-enroll" class="tab">Enroll</button>
    </div>

    <section id="identify" class="panel active">
      <p class="hint">Select an image of a cat and click Identify. If this cat was enrolled, the result shows the pet_id and a similarity score.</p>
      <div class="controls">
        <label class="file-input">
          <input type="file" id="id-file" accept="image/*" />
          Choose Image
        </label>
        <label class="toggle">
          <input type="checkbox" id="id-use-camera" /> Use Camera
        </label>
        <button id="id-capture" class="btn" disabled>Capture</button>
      </div>

      <div class="media">
        <video id="id-video" class="video" autoplay playsinline muted hidden></video>
        <canvas id="id-canvas" class="canvas" hidden></canvas>
        <img id="id-preview" class="preview" alt="Preview" hidden />
      </div>

      <div class="actions">
        <button id="id-run" class="btn primary">Identify</button>
      </div>

      <div id="id-results" class="results"></div>
    </section>

    <section id="enroll" class="panel">
      <p class="hint">Set a unique <code>pet_id</code>, select multiple JPG/PNG images of the same cat, then click <strong>Upload &amp; Rebuild Gallery</strong>.</p>
      <div class="controls">
        <input type="text" id="enr-pet-id" placeholder="pet_id" />
      </div>

      <div class="controls">
        <label class="file-input">
          <input type="file" id="enr-files" accept="image/*" multiple />
          Select Images
        </label>
        <label class="toggle">
          <input type="checkbox" id="enr-use-camera" /> Use Camera
        </label>
        <button id="enr-capture" class="btn" disabled>Capture</button>
        <button id="enr-add" class="btn">Add to Set</button>
      </div>

      <div class="media">
        <video id="enr-video" class="video" autoplay playsinline muted hidden></video>
        <canvas id="enr-canvas" class="canvas" hidden></canvas>
        <img id="enr-preview" class="preview" alt="Preview" hidden />
      </div>

      <div class="gallery" id="enr-gallery"></div>

      <div class="actions">
        <button id="enr-upload" class="btn primary">Upload &amp; Rebuild Gallery</button>
      </div>
    </section>

    <footer>
      <div id="status" class="status">Ready.</div>
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    // Safari needs user gesture before video autoplay
    document.body.addEventListener('click', function once() {
      const vids = document.querySelectorAll('video');
      vids.forEach(v => { try { v.play().catch(()=>{}); } catch(e){} });
      document.body.removeEventListener('click', once);
    }, { once: true });
  </script>
</body>
</html>
